<!DOCTYPE html>
<html>
<head>
    <style>
        body{
            margin:0;
            font-family:Segoe UI,sans-serif;
            background:#eef2ff;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-container{
            width:350px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .login-container h1{
            text-align:center;
            color:#2563eb;
            margin-bottom:25px;
        }

        .login-container form{
            display:flex;
            flex-direction:column;
            gap:15px;
        }

        .login-container input{
            padding:12px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:15px;
        }

        .login-container input:focus{
            border-color:#2563eb;
            outline:none;
        }

        .login-container button{
            background:#2563eb;
            color:white;
            border:none;
            padding:12px;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
            font-weight:600;
        }

        .login-container button:hover{
            background:#1d4ed8;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Admin Login</h1>

    <form action="/admin-login" method="post">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
